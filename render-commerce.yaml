# Create the durable store database without creating a second multiplayer relay.
# Attach its INTERNAL connection string to the existing simple-wars web service.
# Review Render's displayed recurring price before provisioning this resource.
databases:
  - name: simple-wars-store
    region: oregon
    plan: 0.1c-256mb
    databaseName: simple_wars_store
    user: simple_wars_store
    diskSizeGB: 1
    storageAutoscalingEnabled: false
    ipAllowList: []
