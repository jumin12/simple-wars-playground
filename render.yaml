# Render Blueprint — WebSocket relay only.
# Create the static site separately in the dashboard (Publish directory: repo root),
# or serve index.html from GitHub Pages / Netlify / Cloudflare Pages.

services:
  - type: web
    name: simple-wars-mp
    runtime: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
